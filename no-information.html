        color: var(--ink-2);

    }
    .blank__back {
        display: block;
        margin-top: 34px;
        font-size: 0.9rem;
    }
    .blank .mono {
        display: block;
        margin-bottom: 20px;
        color: var(--seal);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
